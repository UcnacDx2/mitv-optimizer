# 1 = enabled, 0 = disabled
# These are runtime options, read by service.sh on every boot. Whether the APKs
# are placed under system/ is decided at build time, not here.
DISABLE_OTA=1
DISABLE_AD_COMPONENTS=1
DISABLE_INSTALLER_RESTRICTION=1
DISABLE_BOOT_HOME_GUARD=0
APPLY_AD_SETTINGS=1
ENABLE_ADB=1
ADB_PORT=5555
